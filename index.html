<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Totem Vip Gráfica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="conversor.js"></script>
<style>
/* Layout: mesmo padrão do sistema Vip Gráfica — cabeçalho branco com logo, faixa escura com etapas em pílula vermelha, painel de trabalho, barra de ações */
:root{
  --bg:#ffffff; --panel:#ffffff; --panel-2:#f6f7f9; --ink:#1b2033; --muted:#646b7a; --line:#e2e4ea;
  --mag:#d12d27; --mag-soft:#fdeeec; --cyan:#1b2033; --nav:#15171f; --nav-ink:#c9ccd6; --yel:#f2c200; --key:#16181d;
  --good:#1d8a4e; --good-soft:#e1f3e8; --warn:#a86500; --warn-soft:#fdf0d9; --bad:#c0352b; --bad-soft:#fbe5e3;
  --shadow:0 1px 2px rgba(27,32,51,.05),0 8px 24px rgba(27,32,51,.06);
  --f-display:"Montserrat",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --f-body:"Montserrat",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Montserrat",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:16px;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--mag);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.kiosk{max-width:1240px;margin:0 auto;height:100%;min-height:560px;display:grid;grid-template-rows:auto 1fr auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.top{display:grid}
.head{display:flex;align-items:center;gap:16px;padding:16px 28px;background:linear-gradient(90deg,var(--panel) 60%,var(--mag-soft))}
.track{background:var(--nav);padding:12px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-height:64px}
.track .hint{color:var(--nav-ink);font-weight:600;font-size:15px}
.logo{height:44px;width:auto;flex:none}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.01em}
.brand span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:8px;padding:8px 16px 8px 8px;border-radius:999px;font-size:15px;font-weight:600;color:var(--nav-ink)}
.steps li i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);color:#fff}
.steps li.on{color:#fff;background:var(--mag);font-weight:700}
.steps li.on i{background:rgba(255,255,255,.25);color:#fff}
.steps li.done i{background:var(--good);color:#fff}
.steps[hidden]{display:none!important}

main{padding:28px 32px;overflow:auto;min-height:0}
.screen{display:grid;gap:22px;animation:in .25s ease-out}
@keyframes in{from{transform:translateY(6px)}to{transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--mag)}
.lead{color:var(--muted);margin:6px 0 0;max-width:62ch}
h2{font-size:clamp(26px,3.2vw,34px)}
.screen>div:first-child:has(h2){border-left:5px solid var(--mag);border-radius:3px;padding-left:18px}

.bar{display:flex;gap:12px;align-items:center;padding:16px 24px;border-top:1px solid var(--line);background:var(--panel-2);flex-wrap:wrap}
.bar .spacer{flex:1}
.btn{min-height:60px;padding:0 28px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:18px;display:inline-flex;align-items:center;gap:10px}
.btn.primary{background:var(--mag);border-color:var(--mag);color:#fff}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);font-weight:600;font-size:15px;min-height:44px;padding:0 12px}
.total-mini{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.total-mini small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.total-mini b{font-family:var(--f-mono);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}

/* início */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
.hero h1{font-size:clamp(38px,5.4vw,68px);line-height:1}
.hero h1 em{font-style:normal;color:var(--mag)}
.start{width:100%;min-height:200px;border-radius:24px;border:0;background:var(--mag);color:#fff;display:grid;place-items:center;gap:6px;padding:24px;box-shadow:0 10px 30px color-mix(in srgb,var(--mag) 28%,transparent)}
.start b{font-family:var(--f-display);font-size:clamp(30px,3.6vw,44px);font-weight:800}
.start span{opacity:.9;font-weight:500}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rule{padding:14px 16px;border-radius:14px;background:var(--panel-2);font-size:15px;min-width:0}
.rule b{display:block;font-size:15px}
.rule span{color:var(--muted);font-size:14px}
.balcao{display:flex;gap:12px;align-items:center;padding:14px 18px;border-radius:14px;border:1px dashed var(--line);color:var(--muted);font-size:15px}

/* cards de escolha */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.choice{text-align:left;padding:22px;border-radius:18px;border:2px solid var(--line);background:var(--panel);display:grid;gap:10px;align-content:start;min-height:150px}
.choice svg{width:44px;height:44px}
.choice b{font-size:21px;font-family:var(--f-display)}
.choice span{color:var(--muted);font-size:15px}
.choice[aria-pressed="true"]{border-color:var(--mag);background:var(--mag-soft)}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.card{border:1px solid var(--line);border-radius:18px;padding:22px;background:var(--panel);display:grid;gap:14px;min-width:0}
.card h3{font-size:20px}
.qrbox{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.qr{background:#fff;padding:12px;border-radius:12px;border:1px solid var(--line);width:204px;height:204px;flex:none}
.qr img,.qr canvas{width:180px!important;height:180px!important;display:block}
.code{font-family:var(--f-mono);font-size:30px;font-weight:800;letter-spacing:.08em}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mag);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.demo{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:10px}
.demo small{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--warn)}
.demo .row{display:flex;gap:10px;flex-wrap:wrap}
.btn.sm{min-height:48px;font-size:16px;padding:0 18px}
.files{display:grid;gap:8px}
.file{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-align:left;width:100%}
.file .ext{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;background:var(--panel-2);color:var(--muted)}
.file b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file span{color:var(--muted);font-size:14px}
.pick{position:relative;overflow:hidden}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}

.msg{padding:14px 16px;border-radius:12px;font-weight:600;font-size:15px}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.good{background:var(--good-soft);color:var(--good)}

/* configuração */
.cfg{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
.opts{display:grid;gap:18px}
.opt{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.opt>label,.opt>span{font-weight:700}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-height:58px;min-width:120px;padding:0 18px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-weight:700;display:inline-flex;align-items:center;gap:10px;justify-content:center}
.seg button[aria-pressed="true"]{border-color:var(--mag);background:var(--mag-soft)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg button small{font-weight:500;color:var(--muted);font-size:13px}
.cmyk{display:inline-flex;gap:2px}
.cmyk i{width:8px;height:16px;border-radius:2px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:58px;height:58px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-size:26px;font-weight:700}
.stepper output{min-width:64px;text-align:center;font-family:var(--f-mono);font-size:26px}
.range{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.range input{width:84px;height:52px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:600 20px var(--f-mono);text-align:center}
.receipt{background:var(--panel-2);border-radius:18px;padding:22px;display:grid;gap:10px;border:1px solid var(--line)}
.receipt .doc{display:flex;gap:10px;align-items:center;font-weight:700;min-width:0}
.receipt .doc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.receipt dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0;font-size:15px}
.receipt dt{color:var(--muted)}
.receipt dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.receipt hr{border:0;border-top:1px dashed var(--line);margin:4px 0;width:100%}
.receipt .tot{display:flex;justify-content:space-between;align-items:baseline}
.receipt .tot b{font-family:var(--f-mono);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.formula{font-size:13px;color:var(--muted)}

/* prévia */
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.pg{display:grid;gap:6px;justify-items:center;font-size:13px;color:var(--muted)}
.sheet{width:100%;aspect-ratio:210/297;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.08);overflow:hidden;display:grid;place-items:center;position:relative}
.sheet.a3{aspect-ratio:297/420}
.sheet canvas,.sheet img{width:100%;height:100%;object-fit:contain;display:block}
.sheet.pb canvas,.sheet.pb img,.sheet.pb .fake{filter:grayscale(1)}
.fake{position:absolute;inset:10% 12%;display:grid;align-content:start;gap:6%}
.fake i{display:block;height:4px;background:#c9ccd3;border-radius:2px}
.fake i.h{height:8px;width:60%;background:#5d6370}
.fake i.c{background:#008fc4;width:40%;height:18px;border-radius:3px}
.fake i:nth-child(4n){width:80%}
.more{display:grid;place-items:center;aspect-ratio:210/297;border:1px dashed var(--line);border-radius:4px;font-weight:700;color:var(--muted)}
.summary{display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:var(--panel-2);font-weight:600;font-size:15px}

/* pagamento */
.paywrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
.bigtotal{font-family:var(--f-mono);font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.payarea{min-height:300px}
.card-anim{display:grid;place-items:center;gap:14px;padding:20px;text-align:center}
.pos{width:120px;height:170px;border-radius:16px;background:var(--key);position:relative}
.pos::before{content:"";position:absolute;inset:14px 14px 70px;border-radius:6px;background:var(--cyan);opacity:.85}
.pos::after{content:"";position:absolute;left:30px;right:30px;bottom:18px;height:34px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--muted) 0 10px,transparent 10px 16px);opacity:.6}
.senha{font-family:var(--f-mono);font-size:64px;font-weight:800;color:var(--mag);line-height:1}

/* impressão */
.done{display:grid;justify-items:center;text-align:center;gap:16px;padding:20px 0}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:var(--good-soft);color:var(--good)}
.ring svg{width:56px;height:56px}
.progress{width:min(520px,100%);height:16px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.progress div{height:100%;background:var(--mag);width:0;transition:width .3s}
.tray{width:min(360px,100%);height:70px;border-radius:0 0 18px 18px;border:3px solid var(--ink);border-top:0;position:relative;margin-top:6px}
.tray::before{content:"";position:absolute;left:20%;right:20%;top:-30px;height:50px;background:#fff;border:1px solid var(--line);border-radius:3px;animation:paper 1.4s ease-in-out infinite}
@keyframes paper{0%{transform:translateY(-20px);opacity:0}60%{opacity:1}100%{transform:translateY(8px)}}
.checks{display:grid;gap:6px;font-size:15px;color:var(--muted)}
.checks div::before{content:"✓ ";color:var(--good);font-weight:700}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.55);display:grid;place-items:center;padding:16px;z-index:10}
.modal{background:var(--panel);color:var(--ink);border-radius:20px;padding:26px;width:min(720px,100%);max-height:calc(100% - 32px);overflow:auto;display:grid;gap:16px;box-shadow:var(--shadow)}
.modal h3{font-size:24px}
.grid-prices{display:grid;grid-template-columns:auto 1fr 1fr;gap:10px 14px;align-items:center}
.grid-prices input,.field input{width:100%;height:46px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:600 18px var(--f-mono);padding:0 12px}
.grid-prices .h{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.field{display:grid;gap:6px;font-weight:600}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600}
.toggle input{width:24px;height:24px;accent-color:var(--mag)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--panel-2);border-radius:12px;padding:12px}
.stat small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.stat b{font-family:var(--f-mono);font-size:22px}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.n{font-family:var(--f-mono);text-align:right}
.note{font-size:13px;color:var(--muted)}

@media (max-width:900px){
  .hero,.split,.cfg,.paywrap{grid-template-columns:1fr}
  .rules{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{margin-left:0}
}
@media (max-width:560px){
  body{padding-inline:16px;font-size:16px}
  .head,.track{padding-inline:16px}
  .logo{height:36px}
  main{padding:20px 16px}
  .bar{padding:12px 16px}
  .opt{grid-template-columns:1fr}
  .steps li span{display:none}
  .steps li{padding:6px}
  .rules{grid-template-columns:1fr}
  .btn{padding:0 18px}
  .bigtotal{font-size:44px}
}

/* ===== Modo fácil (idosos): letras maiores, botões grandes, menos texto ===== */
body{font-size:19px}
.btn{min-height:72px;font-size:21px;padding:0 32px}
.btn.ghost{min-height:52px;font-size:16px}
h2{font-size:clamp(30px,3.6vw,42px)}
.lead{font-size:20px}
.eyebrow{font-size:15px}
.steps li{font-size:16px}
.hint{font-size:17px!important}
/* início */
.hero1{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center;padding-block:12px}
.hero1 h1{font-size:clamp(44px,6vw,80px);line-height:1}
.hero1 h1 em{font-style:normal;color:var(--mag)}
.hero1 .lead{font-size:24px;margin-top:16px}
.start{min-height:260px}
.start b{font-size:clamp(40px,4.6vw,60px)}
.start span{font-size:20px}
.balcao{font-size:19px}
/* envio por QR */
.qrstep{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center}
.qr.big{width:300px;height:300px;padding:16px;border-width:3px;border-color:var(--ink)}
.qr.big img,.qr.big canvas{width:264px!important;height:264px!important}
.howto{list-style:none;margin:0;padding:0;display:grid;gap:22px}
.howto li{display:flex;align-items:center;gap:18px;font-size:clamp(22px,2.4vw,30px);line-height:1.25}
.howto li i{flex:none;width:56px;height:56px;border-radius:50%;background:var(--mag);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:26px}
.recv{display:flex;align-items:center;gap:14px;padding:20px 24px;border-radius:16px;background:var(--panel-2);font-size:22px;font-weight:600}
.recv.ok{background:var(--good-soft);color:var(--good)}
.recv.bad{background:var(--bad-soft);color:var(--bad)}
.recv .dot{width:14px;height:14px}
/* configuração */
.opt{grid-template-columns:230px 1fr}
.opt>span{font-size:21px}
.seg button{min-height:76px;min-width:150px;font-size:20px;padding:0 24px}
.stepper button{width:76px;height:76px;font-size:34px}
.stepper output{font-size:34px;min-width:80px}
.range input{width:100px;height:64px;font-size:24px}
.totalbox{background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:28px;display:grid;gap:8px;text-align:center}
.totalbox small{font-size:16px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.totalbox b{font-size:clamp(44px,5vw,60px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.totalbox span{font-size:19px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--mag);font-weight:700;font-size:19px;text-decoration:underline;padding:8px 0;justify-self:start}
/* prévia grande */
.prevhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pgcount{font-size:24px;font-weight:600;color:var(--muted)}
.pgcount b{color:var(--ink);font-size:30px}
.viewer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.nav{width:96px;height:160px;border-radius:20px;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;align-content:center;gap:4px;font-size:54px;font-weight:700;line-height:1}
.nav span{font-size:15px;font-weight:700}
.nav:disabled{opacity:.3;cursor:not-allowed}
.stage{position:relative;height:max(340px,calc(100vh - 450px));border:0;border-radius:18px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;padding:18px;cursor:zoom-in}
.stage .sheet.big{height:100%;width:auto;max-width:100%;box-shadow:0 6px 24px rgba(0,0,0,.15)}
.zoomhint{position:absolute;right:14px;bottom:14px;background:var(--ink);color:#fff;font-size:16px;font-weight:700;padding:10px 16px;border-radius:999px;display:flex;gap:8px;align-items:center}
.lado{position:absolute;left:14px;top:14px;background:var(--panel);border:1px solid var(--line);font-size:16px;font-weight:700;padding:8px 14px;border-radius:999px}
.thumbs{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px}
.thumb{flex:none;width:84px;border:3px solid transparent;border-radius:8px;background:none;padding:2px;display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.thumb[aria-current="true"]{border-color:var(--mag);color:var(--ink)}
/* tela cheia */
.fs{position:fixed;inset:0;z-index:20;background:#0f1117;display:grid;grid-template-rows:auto 1fr;color:#fff}
.fs-top{display:flex;align-items:center;gap:16px;padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.fs-top .pgc{font-size:26px;font-weight:700;flex:1}
.fs-top .btn{background:#fff;color:#16181d;border-color:#fff}
.fs-body{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:0 16px 20px;min-height:0}
.fs-body .nav{background:#22262e;border-color:#3a3f4b;color:#fff;height:200px}
.fs-page{height:100%;min-height:0;display:flex;align-items:center;justify-content:center}
.fs-page .sheet{height:100%;width:auto;max-width:100%}
@media (max-width:900px){
  .hero1,.qrstep{grid-template-columns:1fr}
  .qrstep{justify-items:center}
  .opt{grid-template-columns:1fr}
  .nav{width:64px;height:120px;font-size:40px}
}
@media (max-width:560px){
  .qr.big{width:240px;height:240px}
  .qr.big img,.qr.big canvas{width:204px!important;height:204px!important}
  .stage{height:60vh}
}
</style>
</head>

      <div><b>Autoatendimento</b><span>Impressão rápida</span></div>
    </div>
    <nav class="track" aria-label="Etapas do pedido">
      <span class="hint" id="hint">Toque em "Começar" para imprimir</span>
      <ol class="steps" id="steps" hidden>
        <li data-s="envio"><i>1</i><span>Arquivo</span></li>
        <li data-s="config"><i>2</i><span>Configurar</span></li>
        <li data-s="previa"><i>3</i><span>Prévia</span></li>
        <li data-s="pagamento"><i>4</i><span>Pagar</span></li>
        <li data-s="impressao"><i>5</i><span>Retirar</span></li>
      </ol>
    </nav>
  </header>
  <main id="main" aria-live="polite"></main>
  <footer class="bar" id="bar"></footer>
</div>
<div id="layer"></div>

<script>
(() => {
  "use strict";
  const $ = (s, el = document) => el.querySelector(s);
  const BRL = n => n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- configuração (provisória; no app real vem da tabela totem_precos) ----------
  const DEFAULT_CFG = { precos: { A4: { pb: 0.5, cor: 2 }, A3: { pb: 1.5, cor: 4 } }, a3Ativo: false, limite: 50, inatividade: 120 };
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  let cfg = Object.assign(structuredClone(DEFAULT_CFG), load("totem.cfg", {}));
  let historico = load("totem.hist", []);

  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }

  // ---------- estado do pedido ----------
  let tela = "inicio", pedido = null, timers = [];
  const novoPedido = () => ({ arquivo: null, origem: "qr", tamanho: "A4", cor: "pb", lados: "frente", copias: 1, de: 1, ate: 1, metodo: null, inicio: Date.now() });
  const clearTimers = () => { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; };

  function calc(p = pedido) {
    const n = p.arquivo ? p.arquivo.paginas : 0;
    const de = Math.max(1, Math.min(p.de, n)), ate = Math.max(de, Math.min(p.ate, n));
    const pags = n ? ate - de + 1 : 0;
    const faces = pags * p.copias;
    const folhasPorCopia = p.lados === "verso" ? Math.ceil(pags / 2) : pags;
    const folhas = folhasPorCopia * p.copias;
    const preco = cfg.precos[p.tamanho][p.cor];
    const total = Math.round(faces * preco * 100) / 100;
    return { pags, faces, folhas, preco, total, de, ate, acima: faces > cfg.limite };
  }

  // ---------- inatividade ----------
  let ultimoToque = Date.now();
  ["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, () => { ultimoToque = Date.now(); }, true));
  setInterval(() => {
    if (tela === "inicio" || tela === "impressao" || tela === "login" || $("#layer .modal")) return;
    if ((Date.now() - ultimoToque) / 1000 > cfg.inatividade) avisoInatividade();
  }, 1000);
  function avisoInatividade() {
    let s = 15;
    const layer = $("#layer");
    layer.innerHTML = `<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ina-t">
      <h3 id="ina-t">Ainda está aí?</h3>
      <p class="lead" style="margin:0">Por segurança, o pedido será cancelado e o arquivo apagado em <b class="mono" id="ina-s">${s}</b> segundos.</p>
      <div class="row" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="ina-ok">Continuar meu pedido</button><button class="btn" id="ina-x">Cancelar pedido</button></div>
    </div></div>`;
    const iv = setInterval(() => { s--; const el = $("#ina-s"); if (el) el.textContent = s; if (s <= 0) { fechar(); reiniciar(); } }, 1000);
    const fechar = () => { clearInterval(iv); layer.innerHTML = ""; ultimoToque = Date.now(); };
    $("#ina-ok").onclick = fechar;
    $("#ina-x").onclick = () => { fechar(); reiniciar(); };
  }

  // ---------- navegação ----------
  const ORDEM = ["envio", "config", "previa", "pagamento", "impressao"];
  function ir(t) {
    clearTimers();
    tela = t;
    const steps = $("#steps");
    steps.hidden = t === "inicio";
    $("#hint").hidden = t !== "inicio";
    const idx = ORDEM.indexOf(t);
    steps.querySelectorAll("li").forEach((li, i) => {
      li.classList.toggle("on", i === idx);
      li.classList.toggle("done", i < idx);
      li.querySelector("i").textContent = i < idx ? "✓" : String(i + 1);
    });
    TELAS[t]();
    $("#main").scrollTop = 0;
  }
  function reiniciar() {
    if (pedido && pedido.arquivo && pedido.arquivo.url && pedido.arquivo.url.startsWith("blob:")) URL.revokeObjectURL(pedido.arquivo.url);
    limparSessao(pedido);
    pedido = null;
    ir("inicio");
  }
  function barra(html) { $("#bar").innerHTML = html; }

  // ---------- ponte de impressão (programa no computador do totem) ----------
  const PONTE = "http://127.0.0.1:9123";
  async function ponteStatus() {
    const ac = new AbortController(); const t = setTimeout(() => ac.abort(), 2500);
    try { const r = await fetch(PONTE + "/status", { signal: ac.signal }); return await r.json(); }
    catch { return null; } finally { clearTimeout(t); }
  }
  async function ponteImprimir(p, c) {
    const a = p.arquivo;
    if (a.fake) throw new Error("arquivo de exemplo");
    const blob = await (await fetch(a.url)).blob();
    const tipo = a.tipo === "pdf" ? "pdf" : (blob.type === "image/png" ? "png" : "jpg");
    const q = new URLSearchParams({ tipo, copias: p.copias, cor: p.cor, lados: p.lados, paginas: a.tipo === "pdf" ? `${c.de}-${c.ate}` : "" });
    const r = await fetch(`${PONTE}/imprimir?${q}`, { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: blob });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.erro || "falha na impressão");
    return j;
  }

  const ICON = {
    qr: `<svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="4" y="4" width="14" height="14" rx="2"/><rect x="26" y="4" width="14" height="14" rx="2"/><rect x="4" y="26" width="14" height="14" rx="2"/><path d="M26 26h6v6h-6zM36 26h4M26 38h4M34 34h6v6" /></svg>`,
    pix: `<svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 4l9 9-9 9-9-9zM22 22l9 9-9 9-9-9zM4 22l9-9 9 9-9 9zM22 22l9-9 9 9-9 9z" stroke-linejoin="round"/></svg>`,
    card: `<svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="4" y="10" width="36" height="24" rx="4"/><path d="M4 17h36M10 27h8"/></svg>`,
    desk: `<svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 20h36v6H4zM8 26v12M36 26v12M16 20v-8a6 6 0 0 1 12 0v8"/></svg>`,
    check: `<svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 29l9 9 19-20"/></svg>`
  };

  // ---------- telas ----------
  const TELAS = {
    inicio() {
      $("#main").innerHTML = `<section class="screen">
        <div class="hero1">
          <div>
            <h1>Imprima aqui <em>seu documento</em></h1>
            <p class="lead">Mande o arquivo pelo celular e retire as folhas na bandeja.</p>
          </div>
          <button class="start" id="go"><b>Começar</b><span>Toque aqui</span></button>
        </div>
        <div class="balcao">${ICON.desk.replace("<svg", '<svg width="34" height="34"')}<span>Precisa de ajuda? <b>Fale com nossa equipe no balcão.</b></span></div>
      </section>`;
      barra(`<button class="btn ghost" id="admin">Equipe</button><span class="spacer"></span>`);
      $("#go").onclick = () => { pedido = novoPedido(); ir("envio"); };
      $("#admin").onclick = abrirAdmin;
    },

    envio() {
      const a = pedido.arquivo;
      $("#main").innerHTML = `<section class="screen">
        <div><div class="eyebrow">Passo 1 de 5</div><h2>Envie o arquivo pelo celular</h2></div>
        <div class="qrstep">
          <div class="qr big" id="qr"></div>
          <ol class="howto">
            <li><i>1</i><span>Abra a <b>câmera</b> do celular</span></li>
            <li><i>2</i><span>Aponte para o <b>quadrado</b> ao lado</span></li>
            <li><i>3</i><span>Toque no link e <b>escolha o arquivo</b></span></li>
          </ol>
        </div>
        <div id="recebido">${arquivoHTML()}</div>
      </section>`;
      iniciarSessao();
      barra(`<button class="btn" id="back">← Voltar</button>
        <label class="btn ghost pick">Testar com arquivo deste computador<input type="file" id="filetest" accept="${window.TotemConversor.ACCEPT}"></label>
        <span class="spacer"></span>
        <button class="btn primary" id="next" ${a ? "" : "disabled"}>Continuar →</button>`);
      $("#filetest").onchange = e => { const f = e.target.files[0]; if (f) lerArquivo(f); };
      $("#back").onclick = reiniciar;
      $("#next").onclick = () => { pedido.avancou = true; ir("config"); };
      if (a && !pedido.avancou && !pedido.erro) timers.push(setTimeout(() => { if (pedido && tela === "envio") { pedido.avancou = true; ir("config"); } }, 2200));
    },

    config() {
      const c = calc();
      const p = pedido;
      const seg = (campo, val, label, extra = "") =>
        `<button data-c="${campo}" data-v="${val}" aria-pressed="${p[campo] === val}">${extra}${label}</button>`;
      const cmyk = `<span class="cmyk" aria-hidden="true"><i style="background:#00a3e0"></i><i style="background:#e0007a"></i><i style="background:#ffd400"></i><i style="background:#16181d"></i></span>`;
      const kk = `<span class="cmyk" aria-hidden="true"><i style="background:#16181d"></i></span>`;
      const n = p.arquivo.paginas;
      $("#main").innerHTML = `<section class="screen">
        <div><div class="eyebrow">Passo 2 de 5</div><h2>Como você quer imprimir?</h2></div>
        <div class="cfg">
          <div class="opts">
            ${cfg.a3Ativo ? `<div class="opt"><span>Tamanho do papel</span><div class="seg">${seg("tamanho", "A4", "A4")}${seg("tamanho", "A3", "A3")}</div></div>` : ""}
            <div class="opt"><span>Cor</span><div class="seg">
              ${seg("cor", "pb", "Preto e branco", kk)}
              ${seg("cor", "cor", "Colorido", cmyk)}
            </div></div>
            <div class="opt"><span>Lados da folha</span><div class="seg">
              ${seg("lados", "frente", "Só frente")}
              ${seg("lados", "verso", "Frente e verso")}
            </div></div>
            <div class="opt"><span>Cópias</span><div class="stepper">
              <button id="menos" aria-label="Menos uma cópia">−</button><output id="copias">${p.copias}</output><button id="mais" aria-label="Mais uma cópia">+</button>
            </div></div>
            ${n > 1 ? (p.faixa ? `<div class="opt"><span>Páginas</span><div class="range">
              <label for="de">da</label><input id="de" type="number" inputmode="numeric" min="1" max="${n}" value="${c.de}">
              <label for="ate">até</label><input id="ate" type="number" inputmode="numeric" min="1" max="${n}" value="${c.ate}">
              <button class="linkbtn" id="todas">Imprimir todas</button>
            </div></div>` : `<button class="linkbtn" id="faixa">Quero imprimir só algumas páginas</button>`) : ""}
          </div>
          <div class="totalbox" aria-live="polite">
            <small>Total</small>
            <b>${BRL(c.total)}</b>
            <span>${c.pags} ${c.pags > 1 ? "páginas" : "página"}${p.copias > 1 ? ` × ${p.copias} cópias` : ""}</span>
            <span>${p.cor === "pb" ? "Preto e branco" : "Colorido"} · ${BRL(c.preco)} por página</span>
          </div>
        </div>
        ${c.acima ? `<div class="recv bad">Passou do limite de ${cfg.limite} páginas. Diminua as cópias ou peça no balcão.</div>` : ""}
      </section>`;
      document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { p[b.dataset.c] = b.dataset.v; ir("config"); });
      $("#menos").onclick = () => { if (p.copias > 1) { p.copias--; ir("config"); } };
      $("#mais").onclick = () => { if (p.copias < 99) { p.copias++; ir("config"); } };
      const fixa = () => {
        let de = parseInt($("#de").value, 10) || 1, ate = parseInt($("#ate").value, 10) || n;
        de = Math.min(Math.max(de, 1), n); ate = Math.min(Math.max(ate, de), n);
        p.de = de; p.ate = ate; ir("config");
      };
      if ($("#de")) { $("#de").onchange = fixa; $("#ate").onchange = fixa; }
      if ($("#faixa")) $("#faixa").onclick = () => { p.faixa = true; ir("config"); };
      if ($("#todas")) $("#todas").onclick = () => { p.faixa = false; p.de = 1; p.ate = Math.min(n, cfg.limite); ir("config"); };
      barra(`<button class="btn" id="back">← Voltar</button><span class="spacer"></span>
        <button class="btn primary" id="next" ${c.acima || !c.pags ? "disabled" : ""}>Ver como fica →</button>`);
      $("#back").onclick = () => ir("envio");
      $("#next").onclick = () => ir("previa");
    },

    previa() {
      const c = calc(), p = pedido;
      if (!p.pv || p.pv < c.de || p.pv > c.ate) p.pv = c.de;
      const nums = [];
      for (let i = c.de; i <= c.ate; i++) nums.push(i);
      const cls = `${p.tamanho === "A3" ? "a3" : ""} ${p.cor}`;
      $("#main").innerHTML = `<section class="screen">
        <div class="prevhead">
          <div><div class="eyebrow">Passo 3 de 5</div><h2>Confira se está certo</h2></div>
          <div class="pgcount" id="pgcount"></div>
        </div>
        <div class="viewer">
          <button class="nav" id="ant" aria-label="Página anterior">‹<span>Anterior</span></button>
          <button class="stage" id="stage" aria-label="Ver em tela cheia">
            <div class="sheet big ${cls}" id="bigsheet"></div>
            <span class="lado" id="lado" hidden></span>
            <span class="zoomhint">⤢ Toque para ver maior</span>
          </button>
          <button class="nav" id="prox" aria-label="Próxima página">›<span>Próxima</span></button>
        </div>
        ${nums.length > 1 ? `<div class="thumbs" id="thumbs">${nums.map(n => `<button class="thumb" data-n="${n}"><div class="sheet ${cls}" data-t="${n}"></div>${n}</button>`).join("")}</div>` : ""}
      </section>`;
      mostrarPagina(p.pv);
      // miniaturas, uma de cada vez para não travar
      (async () => { for (const el of document.querySelectorAll("[data-t]")) { if (tela !== "previa") return; await desenharPagina(el, +el.dataset.t, 160); } })();
      document.querySelectorAll(".thumb").forEach(b => b.onclick = () => mostrarPagina(+b.dataset.n));
      $("#ant").onclick = () => mostrarPagina(pedido.pv - 1);
      $("#prox").onclick = () => mostrarPagina(pedido.pv + 1);
      $("#stage").onclick = abrirTelaCheia;
      barra(`<button class="btn" id="back">← Mudar algo</button><span class="spacer"></span>
        <div class="total-mini"><small>Total</small><b>${BRL(c.total)}</b></div>
        <button class="btn primary" id="next">Está certo, pagar →</button>`);
      $("#back").onclick = () => ir("config");
      $("#next").onclick = () => ir("pagamento");
    },

    pagamento() {
      const c = calc(), p = pedido;
      const m = p.metodo;
      $("#main").innerHTML = `<section class="screen">
        <div><div class="eyebrow">Passo 4 de 5</div><h2>Pagamento</h2></div>
        <div class="paywrap">
          <div class="card">
            <span class="note">Total a pagar</span>
            <div class="bigtotal">${BRL(c.total)}</div>
            <span class="note">${c.faces} ${c.faces > 1 ? "páginas" : "página"} × ${BRL(c.preco)} · ${c.folhas} ${c.folhas > 1 ? "folhas" : "folha"} ${p.tamanho}</span>
            <div class="choices" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
              <button class="choice" data-m="pix" aria-pressed="${m === "pix"}" style="min-height:120px">${ICON.pix}<b>Pix</b></button>
              <button class="choice" data-m="credito" aria-pressed="${m === "credito"}" style="min-height:120px">${ICON.card}<b>Crédito</b></button>
              <button class="choice" data-m="debito" aria-pressed="${m === "debito"}" style="min-height:120px">${ICON.card}<b>Débito</b></button>
              <button class="choice" data-m="balcao" aria-pressed="${m === "balcao"}" style="min-height:120px">${ICON.desk}<b>No caixa</b></button>
            </div>
          </div>
          <div class="card payarea" id="payarea">${m ? "" : `<div class="wait" style="height:100%;justify-content:center">Escolha a forma de pagamento ao lado.</div>`}</div>
        </div>
      </section>`;
      document.querySelectorAll(".choice").forEach(b => b.onclick = () => { p.metodo = b.dataset.m; ir("pagamento"); });
      if (m) areaPagamento(m, c);
      barra(`<button class="btn" id="back">← Voltar</button><span class="spacer"></span><span class="note">A impressão começa só depois do pagamento aprovado.</span>`);
      ponteStatus().then(st => {
        if (tela !== "pagamento" || !st || st.pronta) return;
        $(".paywrap").innerHTML = `<div class="recv bad" style="grid-column:1/-1">A impressora está indisponível agora (${esc(st.motivo)}). Nada foi cobrado. Por favor, fale com a equipe no balcão.</div>`;
      });
      $("#back").onclick = () => { p.metodo = null; ir("previa"); };
    },

    impressao() {
      const c = calc(), p = pedido;
      $("#main").innerHTML = `<section class="screen"><div class="done">
        <div class="eyebrow">Passo 5 de 5</div>
        <h2 id="imp-t">Imprimindo…</h2>
        <p class="lead" id="imp-s" style="margin:0">${c.folhas} ${c.folhas > 1 ? "folhas" : "folha"}. Aguarde um momento.</p>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="imp-bar"></div></div>
        <div class="tray" aria-hidden="true"></div>
      </div></section>`;
      barra(`<span class="spacer"></span><span class="note">Pagamento aprovado · ${BRL(c.total)}</span>`);
      // barra anda devagar enquanto a impressora trabalha (estimativa de 4 s por folha)
      let pct = 0; const est = Math.max(6, c.folhas * 4);
      const iv = setInterval(() => { pct = Math.min(92, pct + 100 / est / 2); const b = $("#imp-bar"); if (b) b.style.width = pct + "%"; }, 500);
      timers.push(iv);
      (async () => {
        const st = await ponteStatus();
        if (!st) {           // sem ponte: modo de demonstração
          await new Promise(r => setTimeout(r, Math.min(6000, c.folhas * 600)));
          clearInterval(iv); if (tela === "impressao") concluir(c, "simulado"); return;
        }
        try {
          await ponteImprimir(p, c);
          clearInterval(iv); if (tela === "impressao") concluir(c, "real");
        } catch (e) {
          clearInterval(iv);
          p.falhaImpressao = e.message;
          $("#main").innerHTML = `<section class="screen"><div class="done">
            <h2>Não conseguimos imprimir</h2>
            <p class="lead" style="margin:0">Seu pagamento está registrado. Mostre esta tela para a equipe no balcão que eles imprimem para você.</p>
            <div class="recv bad">Motivo: ${esc(e.message)}</div></div></section>`;
          barra(`<span class="spacer"></span><button class="btn primary" id="fim">Entendi</button>`);
          $("#fim").onclick = reiniciar;
        }
      })();
    }
  };

  function rotuloLado(n) {
    const c = calc(), idx = n - c.de + 1;
    if (pedido.lados !== "verso") return "";
    return `Folha ${Math.ceil(idx / 2)} · ${idx % 2 ? "frente" : "verso"}`;
  }
  function mostrarPagina(n) {
    const c = calc();
    n = Math.min(Math.max(n, c.de), c.ate);
    pedido.pv = n;
    const idx = n - c.de + 1;
    const pc = $("#pgcount"); if (pc) pc.innerHTML = `Página <b>${idx}</b> de ${c.pags}`;
    if ($("#ant")) $("#ant").disabled = n <= c.de;
    if ($("#prox")) $("#prox").disabled = n >= c.ate;
    const lado = $("#lado"); if (lado) { const t = rotuloLado(n); lado.hidden = !t; lado.textContent = t; }
    const big = $("#bigsheet");
    if (big) { big.dataset.n = n; desenharPagina(big, n, Math.min(1800, big.parentElement.clientHeight * 0.75 * (window.devicePixelRatio || 1))); }
    document.querySelectorAll(".thumb").forEach(b => {
      const on = +b.dataset.n === n; b.setAttribute("aria-current", on);
      if (on) b.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
    });
  }
  function abrirTelaCheia() {
    const c = calc(), p = pedido;
    const cls = `${p.tamanho === "A3" ? "a3" : ""} ${p.cor}`;
    $("#layer").innerHTML = `<div class="fs" role="dialog" aria-modal="true" aria-label="Página em tela cheia">
      <div class="fs-top"><span class="pgc" id="fs-pgc"></span><button class="btn" id="fs-x">✕ Fechar</button></div>
      <div class="fs-body">
        <button class="nav" id="fs-ant" aria-label="Página anterior">‹<span>Anterior</span></button>
        <div class="fs-page" id="fs-page"><div class="sheet ${cls}" id="fs-sheet"></div></div>
        <button class="nav" id="fs-prox" aria-label="Próxima página">›<span>Próxima</span></button>
      </div></div>`;
    const ver = n => {
      n = Math.min(Math.max(n, c.de), c.ate); p.pv = n;
      const t = rotuloLado(n);
      $("#fs-pgc").textContent = `Página ${n - c.de + 1} de ${c.pags}${t ? " · " + t : ""}`;
      $("#fs-ant").disabled = n <= c.de; $("#fs-prox").disabled = n >= c.ate;
      const el = $("#fs-sheet"); el.dataset.n = n;
      desenharPagina(el, n, Math.min(2400, $("#fs-page").clientHeight * 0.75 * (window.devicePixelRatio || 1)));
    };
    $("#fs-ant").onclick = () => ver(p.pv - 1);
    $("#fs-prox").onclick = () => ver(p.pv + 1);
    $("#fs-x").onclick = () => { $("#layer").innerHTML = ""; mostrarPagina(p.pv); };
    let x0 = null;
    const pg = $("#fs-page");
    pg.onpointerdown = e => { x0 = e.clientX; };
    pg.onpointerup = e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (dx < -60) ver(p.pv + 1); else if (dx > 60) ver(p.pv - 1); };
    ver(p.pv);
  }

  function recibo(c) {
    const p = pedido;
    return `<aside class="receipt" aria-label="Resumo do pedido">
      <div class="doc">${p.arquivo.tipo === "pdf" ? "PDF" : "IMG"} · <span>${esc(p.arquivo.nome)}</span></div>
      <dl>
        <dt>Páginas selecionadas</dt><dd>${c.pags}</dd>
        <dt>Cópias</dt><dd>× ${p.copias}</dd>
        <dt>Páginas impressas</dt><dd>${c.faces}</dd>
        <dt>Preço por página</dt><dd>${BRL(c.preco)}</dd>
        <dt>Folhas ${p.tamanho}</dt><dd>${c.folhas}</dd>
      </dl>
      <hr>
      <div class="tot"><span>Total</span><b>${BRL(c.total)}</b></div>
      <div class="formula">Páginas impressas × preço da página. Frente e verso usa menos folhas, mas cada lado conta como uma página.</div>
    </aside>`;
  }

  // ---------- envio ----------
  // ---------- envio real por QR: Supabase (tabela totem_sessoes + bucket totem-uploads) ----------
  const CFG = window.TOTEM_CONFIG || {};
  const sb = (window.supabase && CFG.SUPABASE_ANON_KEY && !String(CFG.SUPABASE_ANON_KEY).startsWith("COLE"))
    ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;
  let sessaoAtiva = null;
  const novoToken = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");
  const urlEnvio = t => new URL("enviar.html?t=" + t, location.href).href;
  const qrStatus = txt => { const w = $("#qrstatus"); if (w) w.textContent = txt; };

  async function iniciarSessao() {
    if (!sb) { qrStatus("Envio por QR não configurado (config.js)"); return; }
    if (!pedido) return;
    if (!pedido.token) {
      const t = novoToken();
      const { error } = await sb.from("totem_sessoes").insert({ token: t });
      if (error) { qrStatus("Não foi possível gerar o QR. Verifique a internet."); return; }
      if (!pedido) { sb.from("totem_sessoes").delete().eq("token", t); return; }
      pedido.token = t;
    }
    const t = pedido.token;
    const box = $("#qr");
    if (box && !box.firstChild) {
      try { new QRCode(box, { text: urlEnvio(t), width: 264, height: 264, colorDark: "#16181d", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M }); } catch {}
    }
    if (!pedido.arquivo) qrStatus("Esperando seu arquivo…");
    if (sessaoAtiva && sessaoAtiva.token === t) return;
    pararSessao();
    const ch = sb.channel("totem-" + t)
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "totem_sessoes", filter: "token=eq." + t }, p => tratarSessao(p.new))
      .subscribe();
    const poll = setInterval(async () => {
      const { data } = await sb.from("totem_sessoes").select("*").eq("token", t).maybeSingle();
      if (data) tratarSessao(data);
    }, 4000);
    sessaoAtiva = { token: t, ch, poll };
  }
  function tratarSessao(row) {
    if (!row || !pedido || pedido.token !== row.token) return;
    if (row.status === "conectado" && !pedido.arquivo) qrStatus("Celular conectado. Esperando o arquivo…");
    if (row.status === "enviado" && row.arquivo_path && pedido.recebendo !== row.arquivo_path) receberRemoto(row);
  }
  async function receberRemoto(row) {
    pedido.recebendo = row.arquivo_path;
    pedido.erro = null;
    const rec = $("#recebido"); if (rec) rec.innerHTML = `<div class="recv"><span class="dot"></span>Recebendo ${esc(row.arquivo_nome)}…</div>`;
    const { data, error } = await sb.storage.from("totem-uploads").createSignedUrl(row.arquivo_path, 3600);
    if (error || !data) { pedido.erro = "Não foi possível baixar o arquivo enviado. Tente enviar de novo."; pedido.recebendo = null; return ir("envio"); }
    const url = data.signedUrl;
    if (row.arquivo_tipo === "img") return aceitar({ nome: row.arquivo_nome, paginas: 1, tipo: "img", url, path: row.arquivo_path });
    try {
      const doc = await pdfjsLib.getDocument({ url }).promise;
      aceitar({ nome: row.arquivo_nome, paginas: doc.numPages, tipo: "pdf", url, doc, path: row.arquivo_path });
    } catch { pedido.erro = `Não foi possível abrir "${row.arquivo_nome}". O PDF pode estar protegido por senha.`; ir("envio"); }
  }
  function pararSessao() {
    if (!sessaoAtiva) return;
    try { sb.removeChannel(sessaoAtiva.ch); } catch {}
    clearInterval(sessaoAtiva.poll);
    sessaoAtiva = null;
  }
  async function limparSessao(p) {
    pararSessao();
    if (!sb || !p || !p.token) return;
    try {
      const { data } = await sb.from("totem_sessoes").select("arquivo_path").eq("token", p.token).maybeSingle();
      if (data && data.arquivo_path) await sb.storage.from("totem-uploads").remove([data.arquivo_path]);
      await sb.from("totem_sessoes").delete().eq("token", p.token);
    } catch {}
  }

  // ---------- login do totem (usuário do sistema, ex.: "totem") ----------

  async function sairTotem() { if (sb) { await sb.auth.signOut(); telaLogin(); } }

  function arquivoHTML() {
    const a = pedido.arquivo;
    if (pedido.erro) return `<div class="recv bad">${esc(pedido.erro)}</div>`;
    if (!a) return `<div class="recv"><span class="dot"></span><span id="qrstatus">Esperando seu arquivo…</span></div>`;
    return `<div class="recv ok">✓ Arquivo recebido: ${esc(a.nome)} (${a.paginas} ${a.paginas > 1 ? "páginas" : "página"})</div>`;
  }

  function aceitar(arq) {
    pedido.arquivo = arq;
    pedido.avancou = false; pedido.faixa = false; pedido.pv = null;
    pedido.de = 1; pedido.ate = arq.paginas;
    if (arq.paginas > cfg.limite) pedido.ate = cfg.limite;
    ir("envio");
  }

  async function lerArquivo(f) {
    pedido.erro = null;
    const rec = $("#recebido"); if (rec) rec.innerHTML = `<div class="recv"><span class="dot"></span>Preparando ${esc(f.name)}…</div>`;
    let arq;
    try { arq = await window.TotemConversor.normalizar(f); }
    catch (e) { pedido.erro = e.totem ? e.message : `Não foi possível ler "${f.name}".`; pedido.arquivo = null; return ir("envio"); }
    const nome = arq.nome;
    const url = URL.createObjectURL(arq.blob);
    if (arq.tipo === "img") return aceitar({ nome, paginas: 1, tipo: "img", url });
    $("#recebido").innerHTML = `<div class="recv"><span class="dot"></span>Lendo ${esc(nome)}…</div>`;
    try {
      if (!window.pdfjsLib) throw new Error("leitor indisponível");
      const doc = await pdfjsLib.getDocument({ url }).promise;
      aceitar({ nome, paginas: doc.numPages, tipo: "pdf", url, doc });
    } catch (e) {
      URL.revokeObjectURL(url);
      pedido.erro = `Não foi possível abrir "${nome}". O PDF pode estar protegido por senha ou corrompido.`;
      ir("envio");
    }
  }

  async function desenharPagina(el, n, larg = 260) {
    const a = pedido.arquivo;
    if (a.fake) {
      const linhas = 9 + (n * 7) % 6;
      const temCor = a.tipo === "img" || n % 3 === 1;
      el.innerHTML = a.tipo === "img"
        ? `<div class="fake" style="inset:8%;background:linear-gradient(160deg,#9bc6e6,#e8b7cf 60%,#f3dd8a);border-radius:2px"></div>`
        : `<div class="fake"><i class="h"></i>${temCor ? '<i class="c"></i>' : ""}${"<i></i>".repeat(linhas)}</div>`;
      return;
    }
    if (a.tipo === "img") { el.innerHTML = `<img alt="" src="${a.url}">`; return; }
    try {
      const page = await a.doc.getPage(n);
      const vp1 = page.getViewport({ scale: 1 });
      const scale = Math.max(80, larg) / vp1.width;
      const vp = page.getViewport({ scale });
      const cv = document.createElement("canvas");
      cv.width = vp.width; cv.height = vp.height;
      await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
      if (el.isConnected && (!el.dataset.n || +el.dataset.n === n)) { el.innerHTML = ""; el.appendChild(cv); }
    } catch { el.textContent = "Pág. " + n; }
  }

  // ---------- pagamento ----------
  function areaPagamento(m, c) {
    const area = $("#payarea");
    const simular = (txt = "Simular pagamento aprovado") => `<div class="demo"><small>Só no protótipo</small><div class="row"><button class="btn sm" id="aprovar">${txt}</button><button class="btn sm" id="recusar">Simular recusa</button></div></div>`;

        <div class="qrbox"><div class="qr" id="pixqr"></div>

          <div class="wait"><span class="dot"></span>Aguardando pagamento · <span class="mono" id="pixs">5:00</span></div></div>
        </div>${simular()}`;
      try { if (window.QRCode) new QRCode($("#pixqr"), { text: "PIX-DEMO|VIPGRAFICA|" + c.total.toFixed(2) + "|" + Date.now(), width: 180, height: 180, colorDark: "#16181d", colorLight: "#ffffff" }); } catch {}
      const iv = setInterval(() => { s--; const el = $("#pixs"); if (el) el.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); if (s <= 0) { clearInterval(iv); expirou(); } }, 1000);

          <p style="margin:0"><b>Aproxime ou insira o cartão na maquininha</b><br><span class="note">Valor enviado: ${BRL(c.total)}${m === "credito" ? " · à vista" : ""}</span></p>
          <div class="wait"><span class="dot"></span>Aguardando a maquininha…</div></div>${simular()}`;
    } else {
      const senha = "T-" + String(historico.length + 31).padStart(3, "0");
      pedido.senha = senha;
      area.innerHTML = `<h3>Pague no caixa</h3>

        <div class="wait"><span class="dot"></span>Aguardando confirmação do atendente…</div>
        ${simular("Simular confirmação do atendente")}`;
    }
    $("#aprovar").onclick = () => ir("impressao");
    $("#recusar").onclick = () => {
      area.insertAdjacentHTML("afterbegin", `<div class="msg bad">Pagamento não aprovado. Tente de novo ou escolha outra forma.</div>`);
      $("#recusar").disabled = true;

  function expirou() {
    const area = $("#payarea");
    if (area) area.innerHTML = `<h3>O código Pix expirou</h3><p class="note">Nada foi cobrado.</p><button class="btn primary" id="novo">Gerar novo código</button>`;
    const b = $("#novo"); if (b) b.onclick = () => ir("pagamento");
  }

  // ---------- conclusão ----------
  function concluir(c, modo = "simulado") {
    const p = pedido;
    historico.unshift({ modo, quando: Date.now(), arquivo: p.arquivo.nome, origem: p.origem, paginas: c.faces, folhas: c.folhas, valor: c.total, metodo: p.metodo, cfg: `${p.tamanho} ${p.cor === "pb" ? "P&B" : "cor"} ${p.lados === "verso" ? "F/V" : "F"}`, segundos: Math.round((Date.now() - p.inicio) / 1000) });
    historico = historico.slice(0, 200);
    save("totem.hist", historico);
    let s = 20;
    $("#main").innerHTML = `<section class="screen"><div class="done">
      <div class="ring">${ICON.check}</div>
      <h2>Pronto! Retire suas folhas na bandeja.</h2>
      <p class="lead" style="margin:0">${c.folhas} ${c.folhas > 1 ? "folhas" : "folha"} ${p.tamanho} · ${BRL(c.total)} · Obrigado pela preferência.</p>
      <div class="checks"><div>Pagamento aprovado</div><div>Impressão concluída</div><div>Arquivo apagado do totem</div></div>
    </div></section>`;
    barra(`<span class="note">Voltando ao início em <span class="mono" id="vs">${s}</span>s</span><span class="spacer"></span><button class="btn primary" id="fim">Concluir</button>`);
    const iv = setInterval(() => { s--; const el = $("#vs"); if (el) el.textContent = s; if (s <= 0) reiniciar(); }, 1000);
    timers.push(iv);
    $("#fim").onclick = reiniciar;
  }

  // ---------- painel da equipe ----------

  function painel() {
    const tot = historico.reduce((a, h) => ({ n: a.n + 1, pag: a.pag + h.paginas, val: a.val + h.valor, seg: a.seg + h.segundos }), { n: 0, pag: 0, val: 0, seg: 0 });
    const media = tot.n ? Math.round(tot.seg / tot.n) : 0;
    const fmtT = s => Math.floor(s / 60) + "min " + String(s % 60).padStart(2, "0") + "s";
    const met = { pix: "Pix", credito: "Crédito", debito: "Débito", balcao: "Caixa" };
    const pr = cfg.precos;
    $("#layer").innerHTML = `<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="pn-t" style="width:min(860px,100%)">
      <h3 id="pn-t">Painel da equipe</h3>
      <div class="stats">
        <div class="stat"><small>Pedidos</small><b>${tot.n}</b></div>
        <div class="stat"><small>Páginas</small><b>${tot.pag}</b></div>
        <div class="stat"><small>Faturado</small><b>${BRL(tot.val)}</b></div>
        <div class="stat"><small>Tempo médio</small><b>${tot.n ? fmtT(media) : "—"}</b></div>
      </div>
      <p class="note" style="margin:0">Pedidos de teste feitos neste navegador. No piloto, estes números vêm da tabela de pedidos.</p>
      <div class="recv" id="ponteinfo" style="font-size:16px"><span class="dot"></span>Verificando a impressora…</div>
      <h3 style="font-size:18px">Preço por página (provisório)</h3>
      <div class="grid-prices">
        <span></span><span class="h">Preto e branco</span><span class="h">Colorido</span>
        <b>A4</b><input id="a4pb" type="number" step="0.05" min="0" value="${pr.A4.pb}"><input id="a4cor" type="number" step="0.05" min="0" value="${pr.A4.cor}">
        <b>A3</b><input id="a3pb" type="number" step="0.05" min="0" value="${pr.A3.pb}"><input id="a3cor" type="number" step="0.05" min="0" value="${pr.A3.cor}">
      </div>
      <div class="fields">
        <div class="field"><label for="lim">Limite de páginas por pedido</label><input id="lim" type="number" min="1" value="${cfg.limite}"></div>
        <div class="field"><label for="ina">Inatividade até cancelar (s)</label><input id="ina" type="number" min="30" value="${cfg.inatividade}"></div>
      </div>
      <label class="toggle"><input type="checkbox" id="a3on" ${cfg.a3Ativo ? "checked" : ""}> Liberar A3 no totem</label>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="salvar">Salvar</button><button class="btn" id="padrao">Voltar aos valores provisórios</button><button class="btn" id="sair">Desconectar totem</button><button class="btn" id="fechar">Fechar</button></div>
      <div id="pmsg"></div>
      ${historico.length ? `<h3 style="font-size:18px">Últimos pedidos</h3><div class="tbl"><table>
        <thead><tr><th>Hora</th><th>Arquivo</th><th>Origem</th><th>Config.</th><th>Págs.</th><th>Valor</th><th>Pagamento</th><th>Tempo</th></tr></thead>
        <tbody>${historico.slice(0, 15).map(h => `<tr><td>${new Date(h.quando).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</td><td>${esc(h.arquivo)}</td><td>${h.origem === "usb" ? "Pendrive" : "Celular"}</td><td>${h.cfg}</td><td class="n">${h.paginas}</td><td class="n">${BRL(h.valor)}</td><td>${met[h.metodo] || "—"}</td><td class="n">${fmtT(h.segundos)}</td></tr>`).join("")}</tbody>
      </table></div><button class="btn ghost" id="limpar">Apagar pedidos de teste</button>` : ""}
    </div></div>`;
    ponteStatus().then(st => {
      const el = $("#ponteinfo"); if (!el) return;
      if (!st) { el.className = "recv"; el.textContent = "Ponte de impressão não encontrada neste computador: o totem está em modo de demonstração (não imprime)."; return; }
      el.className = "recv " + (st.pronta ? "ok" : "bad");
      el.textContent = st.pronta ? `Impressora pronta: ${st.impressora}` : `Impressora com problema: ${st.motivo}`;
    });
    const num = (id, d) => { const v = parseFloat($(id).value.replace(",", ".")); return isFinite(v) && v >= 0 ? Math.round(v * 100) / 100 : d; };
    $("#salvar").onclick = () => {
      cfg.precos = { A4: { pb: num("#a4pb", pr.A4.pb), cor: num("#a4cor", pr.A4.cor) }, A3: { pb: num("#a3pb", pr.A3.pb), cor: num("#a3cor", pr.A3.cor) } };
      cfg.limite = Math.max(1, Math.round(num("#lim", cfg.limite)));
      cfg.inatividade = Math.max(30, Math.round(num("#ina", cfg.inatividade)));
      cfg.a3Ativo = $("#a3on").checked;
      save("totem.cfg", cfg);
      $("#pmsg").innerHTML = `<div class="msg good">Salvo. Vale para os próximos pedidos.</div>`;
      if (tela === "inicio") ir("inicio");
    };
    $("#padrao").onclick = () => { cfg = structuredClone(DEFAULT_CFG); save("totem.cfg", cfg); painel(); };
    $("#fechar").onclick = () => { $("#layer").innerHTML = ""; ir(tela); };
    $("#sair").onclick = () => { $("#layer").innerHTML = ""; sairTotem(); };
    const l = $("#limpar"); if (l) l.onclick = () => { historico = []; save("totem.hist", historico); painel(); };
  }

  (async () => {
    if (!sb) return ir("inicio");
    const { data } = await sb.auth.getSession();
    if (data && data.session) ir("inicio"); else telaLogin();
  })();
})();
</script>

</body>
</html>
